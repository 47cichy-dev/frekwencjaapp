<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ile lekcji mogę opuścić?</title>
<style>
:root{--bg:#eef0fb;--bg2:#dfe4ff;--glass:rgba(255,255,255,.72);--stroke:rgba(255,255,255,.9);--text:#161a2e;--muted:#68708c;--accent:#5b6cff;--accent2:#9b6bff;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--track:rgba(91,108,255,.14);--chip:rgba(91,108,255,.1);--shadow:0 10px 30px rgba(60,70,140,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d1a;--bg2:#171a35;--glass:rgba(30,34,66,.62);--stroke:rgba(255,255,255,.08);--text:#eef0ff;--muted:#9aa2c7;--accent:#7b8aff;--accent2:#b18bff;--track:rgba(123,138,255,.16);--chip:rgba(123,138,255,.14);--shadow:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 85% -10%,var(--bg2),transparent 60%),radial-gradient(700px 500px at -10% 110%,var(--bg2),transparent 60%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:460px;margin:0 auto;padding:22px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.2}
.pill{font-size:.75rem;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--chip);color:var(--accent);white-space:nowrap}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hero{text-align:center;padding:24px 18px 18px}
.ring{position:relative;width:200px;height:200px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .tr{stroke:var(--track)}
.ring .pr{stroke:var(--ok);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .6s,stroke .3s}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:3.8rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.cap{font-size:.78rem;color:var(--muted);margin-top:4px}
.msg{margin:14px 0 16px;font-size:.95rem;color:var(--muted);min-height:1.4em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--chip);border-radius:16px;padding:10px 6px}
.tile b{display:block;font-size:1.15rem}
.tile span{font-size:.68rem;color:var(--muted)}
.sec{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.add{display:flex;align-items:center;gap:10px}
.add .step{flex:1}
.big{border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(91,108,255,.35);cursor:pointer;width:auto}
.big.full{width:100%}
.big:active{transform:scale(.97)}
.ghost{border:1px solid var(--stroke);background:var(--chip);color:var(--text);border-radius:16px;padding:13px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:0 0 6px}
.step{display:flex;align-items:center;background:var(--chip);border-radius:16px;padding:4px}
.step button{width:38px;height:38px;border:0;border-radius:12px;background:var(--glass);color:var(--text);font-size:1.2rem;font-weight:600;cursor:pointer;flex:none}
.step input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font:inherit;font-size:1.1rem;font-weight:700;color:var(--text);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input:focus,.field:focus{outline:none}
.step:focus-within,.field:focus{box-shadow:0 0 0 2px var(--accent)}
.field{width:100%;border:0;background:var(--chip);color:var(--text);font:inherit;padding:14px;border-radius:14px;margin-bottom:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:10px;border-radius:11px;cursor:pointer}
.tabs button.on{background:var(--glass);color:var(--text)}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em;margin:4px 0 10px}
.or{text-align:center;color:var(--muted);font-size:.8rem;margin:12px 0}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;margin-top:12px;width:100%}
.note{font-size:.74rem;color:var(--muted);margin:2px 6px 0;text-align:center}
.warn{background:rgba(245,158,11,.15);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:.85rem;margin-bottom:14px}
.credit{position:fixed;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:.75rem;font-weight:600;color:var(--muted);background:var(--glass);border:1px solid var(--stroke);padding:5px 12px;border-radius:99px;pointer-events:none}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <!-- EKRAN LOGOWANIA -->
  <div id="authView" class="hide">
    <header><h1>Ile lekcji mogę<br>jeszcze opuścić?</h1></header>
    <div id="cfgWarn" class="warn hide">Najpierw wklej klucze Firebase do pliku (sekcja firebaseConfig w kodzie).</div>
    <section class="card">
      <div class="tabs"><button id="tabIn" class="on">Logowanie</button><button id="tabUp">Rejestracja</button></div>
      <input class="field" id="email" type="email" placeholder="Adres e-mail" autocomplete="email">
      <input class="field" id="pass" type="password" placeholder="Hasło (min. 6 znaków)" autocomplete="current-password">
      <div class="err" id="err"></div>
      <button class="big full" id="go">Zaloguj się</button>
      <div class="or">lub</div>
      <button class="ghost" id="google">Kontynuuj z Google</button>
      <button class="link" id="reset">Nie pamiętam hasła</button>
    </section>
  </div>

  <!-- EKRAN APLIKACJI -->
  <div id="appView" class="hide">
    <header>
      <h1>Ile lekcji mogę<br>jeszcze opuścić?</h1>
      <div style="text-align:right"><div class="pill" id="pill">18 tygodni</div><button class="link" id="out" style="margin-top:6px">Wyloguj</button></div>
    </header>
    <section class="card hero">
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle class="pr" id="pr" cx="60" cy="60" r="54"/></svg>
        <div class="c"><div class="num" id="left">0</div><div class="cap">lekcji zostało</div></div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="tiles">
        <div class="tile"><b id="t1">0</b><span>limit</span></div>
        <div class="tile"><b id="t2">0</b><span>opuszczone</span></div>
        <div class="tile"><b id="t3">0</b><span>wszystkich lekcji</span></div>
      </div>
    </section>
    <section class="card">
      <p class="sec">Moje nieobecności</p>
      <div class="add">
        <div class="step"><button data-t="missed" data-d="-1">−</button><input id="missed" type="number" min="0" inputmode="numeric" value="0"><button data-t="missed" data-d="1">+</button></div>
        <button class="big" id="plus">+ Nieobecność</button>
      </div>
    </section>
    <section class="card">
      <p class="sec">Ustawienia semestru</p>
      <div class="grid">
        <div><label for="weeks">Tygodni w semestrze</label><div class="step"><button data-t="weeks" data-d="-1">−</button><input id="weeks" type="number" min="1" max="40" inputmode="numeric" value="18"><button data-t="weeks" data-d="1">+</button></div></div>
        <div><label for="per">Lekcji tygodniowo</label><div class="step"><button data-t="per" data-d="-1">−</button><input id="per" type="number" min="1" max="60" inputmode="numeric" value="5"><button data-t="per" data-d="1">+</button></div></div>
        <div style="grid-column:1/-1"><label for="req">Wymagana frekwencja (%)</label><div class="step"><button data-t="req" data-d="-5">−</button><input id="req" type="number" min="0" max="100" inputmode="numeric" value="50"><button data-t="req" data-d="5">+</button></div></div>
      </div>
    </section>
    <p class="note" id="sync">Dane zapisują się na Twoim koncie.</p>
  </div>
</main>
<div class="credit">by cichy</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== WKLEJ TUTAJ SWOJE KLUCZE Z FIREBASE (Ustawienia projektu → Twoje aplikacje → Aplikacja internetowa) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBN_q05s1N0fixyF3NrJBoccnsVWui3gdM",
  authDomain: "frekwencja-app.firebaseapp.com",
  projectId: "frekwencja-app",
  storageBucket: "frekwencja-app.firebasestorage.app",
  messagingSenderId: "428559534894",
  appId: "1:428559534894:web:fb184c79b4cae43eb608bf",
  measurementId: "G-W0JN1LRHT8"
};
/* ================================================================================================================ */

const $=id=>document.getElementById(id);
const configured=!firebaseConfig.apiKey.startsWith("WKLEJ");
let auth,db,user=null,mode="in",saveTimer;
const ids=['weeks','per','req','missed'];

const errs={"auth/invalid-credential":"Nieprawidłowy e-mail lub hasło.","auth/invalid-email":"Niepoprawny adres e-mail.","auth/email-already-in-use":"Ten e-mail ma już konto. Zaloguj się.","auth/weak-password":"Hasło jest za słabe (min. 6 znaków).","auth/missing-password":"Wpisz hasło.","auth/popup-closed-by-user":"Okno logowania zostało zamknięte.","auth/too-many-requests":"Za dużo prób. Spróbuj za chwilę.","auth/network-request-failed":"Brak połączenia z internetem."};
const showErr=e=>{$('err').style.color='var(--bad)';$('err').textContent=errs[e.code]||"Coś poszło nie tak. Spróbuj ponownie."};

function setMode(m){mode=m;$('tabIn').classList.toggle('on',m==='in');$('tabUp').classList.toggle('on',m==='up');$('go').textContent=m==='in'?'Zaloguj się':'Załóż konto';$('pass').autocomplete=m==='in'?'current-password':'new-password';$('err').textContent='';$('reset').classList.toggle('hide',m==='up')}
$('tabIn').onclick=()=>setMode('in');$('tabUp').onclick=()=>setMode('up');

if(!configured){$('cfgWarn').classList.remove('hide');$('authView').classList.remove('hide')}
else{
  const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
  $('go').onclick=async()=>{
    $('err').textContent='';
    try{const e=$('email').value.trim(),p=$('pass').value;
      mode==='in'?await signInWithEmailAndPassword(auth,e,p):await createUserWithEmailAndPassword(auth,e,p)}catch(x){showErr(x)}};
  $('google').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){showErr(x)}};
  $('reset').onclick=async()=>{
    const e=$('email').value.trim();if(!e){$('err').textContent='Wpisz najpierw swój e-mail.';return}
    try{await sendPasswordResetEmail(auth,e);$('err').style.color='var(--ok)';$('err').textContent='Wysłaliśmy link do zmiany hasła.'}catch(x){showErr(x)}};
  $('out').onclick=()=>signOut(auth);
  onAuthStateChanged(auth,async u=>{
    user=u;
    $('authView').classList.toggle('hide',!!u);$('appView').classList.toggle('hide',!u);
    if(u){
      try{const s=await getDoc(doc(db,'users',u.uid));if(s.exists()){const d=s.data();ids.forEach(i=>{if(d[i]!==undefined)$(i).value=d[i]})}}
      catch(e){$('sync').textContent='Nie udało się wczytać danych (sprawdź reguły Firestore).'}
      calc(false);
    }
  });
}

const num=(id,def)=>{const v=parseFloat($(id).value);return isNaN(v)||v<0?def:v};
const weeksWord=n=>n===1?'tydzień':(n%10>=2&&n%10<=4&&!(n%100>=12&&n%100<=14))?'tygodnie':'tygodni';
function save(){
  if(!user)return;clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const d={};ids.forEach(i=>d[i]=parseFloat($(i).value)||0);
    try{await setDoc(doc(db,'users',user.uid),d,{merge:true});$('sync').textContent='Zapisano na koncie ✓'}
    catch(e){$('sync').textContent='Błąd zapisu (sprawdź reguły Firestore).'}
  },600);
}
function calc(doSave=true){
  const w=Math.floor(num('weeks',0)),p=Math.floor(num('per',0)),r=Math.min(100,num('req',50)),m=Math.floor(num('missed',0));
  const total=w*p,need=Math.ceil(total*r/100),allowed=Math.max(0,total-need),left=allowed-m;
  const low=left<=Math.ceil(allowed*.2),col=left<0?'var(--bad)':low?'var(--warn)':'var(--ok)';
  $('pill').textContent=w+' '+weeksWord(w);
  $('left').textContent=Math.max(0,left);$('left').style.color=col;
  const frac=allowed>0?Math.max(0,Math.min(1,left/allowed)):0;
  $('pr').style.strokeDashoffset=339.3*(1-frac);$('pr').style.stroke=col;
  $('msg').textContent=total===0?'Uzupełnij dane semestru.':left<0?`Przekroczono limit o ${-left} lekcji!`:left===0?'Limit wyczerpany – nie możesz już opuszczać.':low?'Uważaj, limit się kończy.':'Spokojnie, masz jeszcze zapas.';
  $('t1').textContent=allowed;$('t2').textContent=m;$('t3').textContent=total;
  if(doSave)save();
}
ids.forEach(i=>$(i).addEventListener('input',()=>calc()));
document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{
  const el=$(b.dataset.t),min=parseFloat(el.min)||0,max=el.max?parseFloat(el.max):Infinity;
  el.value=Math.min(max,Math.max(min,Math.floor(num(b.dataset.t,0))+parseInt(b.dataset.d)));calc();
});
$('plus').onclick=()=>{$('missed').value=Math.floor(num('missed',0))+1;calc()};
setMode('in');calc(false);
</script>
</body>
</html>
